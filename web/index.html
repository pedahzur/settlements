<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>West Bank Settlements — Interactive Data Map</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<style>
  :root { --panel: #ffffff; --ink: #1b2430; --muted: #6b7785; --line: #e3e8ee; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color: var(--ink); }
  #map { position: absolute; inset: 0; }
  .panel {
    position: absolute; top: 12px; left: 12px; z-index: 1000; width: 300px;
    max-height: calc(100% - 24px); overflow-y: auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 24px rgba(20,30,45,.12);
    padding: 14px 16px;
  }
  .panel h1 { font-size: 16px; margin: 0 0 2px; }
  .panel .sub { color: var(--muted); font-size: 11.5px; margin: 0 0 12px; line-height: 1.4; }
  .grp { margin-bottom: 12px; }
  .grp label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; }
  select, input[type=range] { width: 100%; }
  select { padding: 6px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; background: #fff; }
  .yearrow { display: flex; align-items: center; gap: 8px; }
  .yearrow #yearval { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 38px; text-align: right; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 11.5px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; user-select: none; background: #fff; }
  .chip.on { background: #1b2430; color: #fff; border-color: #1b2430; }
  .legend { font-size: 11.5px; }
  .legend .row { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
  .legend .sw { width: 13px; height: 13px; border-radius: 3px; flex: none; }
  .foot { font-size: 10.5px; color: var(--muted); margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; line-height: 1.5; }
  .foot a { color: #2b6cb0; }
  .leaflet-popup-content { font-size: 12.5px; line-height: 1.5; }
  .leaflet-popup-content b { font-size: 13.5px; }
  .leaflet-popup-content table { border-collapse: collapse; margin-top: 4px; }
  .leaflet-popup-content td { padding: 1px 6px 1px 0; }
  .leaflet-popup-content td.k { color: var(--muted); }
  .count { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .fallback-icon { background: transparent; border: 0; }
  .fallback-icon span {
    display: block; width: 8px; height: 8px; transform: rotate(45deg);
    border: 1px solid #263746; box-shadow: 0 0 0 1px rgba(255,255,255,.7);
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>West Bank Settlements</h1>
  <p class="sub">Settlement-level panel — population, growth, voting, socio-economic
  standing &amp; built-up area. Footprints are outlined and filled by the selected
  metric; small diamonds mark entities without a mapped polygon.
  <a href="golan.html">Golan Heights map ›</a></p>

  <div class="grp">
    <label for="metric">Colour by</label>
    <select id="metric"></select>
  </div>

  <div class="grp">
    <label for="year">Population year</label>
    <div class="yearrow">
      <input type="range" id="year" />
      <span id="yearval"></span>
    </div>
  </div>

  <div class="grp">
    <label>Show types</label>
    <div class="chips" id="types"></div>
  </div>

  <div class="grp legend" id="legend"></div>
  <div class="count" id="count"></div>

  <div class="foot" id="foot"></div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
